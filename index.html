<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mock Test Trainer</title>
  <link rel="stylesheet" href="style.css?v=4" />
</head>
<body>
  <header class="topbar">
    <div class="brand" data-nav="home">Mock Test Trainer</div>
    <nav>
      <button class="nav-btn" data-nav="home">Home</button>
      <button class="nav-btn" data-nav="learn">Flash Cards</button>
      <button class="nav-btn" data-nav="mocks">Mock Tests</button>
      <button class="nav-btn" data-nav="mini">Mini Practice</button>
      <button class="nav-btn" data-nav="courses">Courses</button>
    </nav>
  </header>

  <main id="view" class="view"></main>

  <!-- View templates -->
  <template id="tpl-home">
    <section class="home">
      <h1>Mock Test Trainer</h1>
      <p class="muted">Practice and test yourself on the question bank.</p>
      <div class="cards">
        <button class="card" data-nav="learn">
          <h2>Learning Mode</h2>
          <p>Flip flash cards to study questions and answers.</p>
        </button>
        <button class="card" data-nav="mocks">
          <h2>Full Mock Test</h2>
          <p>Run a timed 2-hour mock exam.</p>
        </button>
        <button class="card" data-nav="mini">
          <h2>Mini Practice</h2>
          <p>Drill the questions you previously got wrong.</p>
        </button>
        <button class="card" data-nav="courses">
          <h2>Courses</h2>
          <p>Read module/lesson study notes for AWS training courses.</p>
        </button>
      </div>
      <div class="stats" id="home-stats"></div>
    </section>
  </template>

  <template id="tpl-learn">
    <section class="learn">
      <header class="page-head">
        <h1>Flash Cards</h1>
      </header>
      <div class="learn-toolbar">
        <div class="toolbar-row">
          <div class="mode-toggle" role="tablist">
            <button id="mode-all" class="mode-btn active" role="tab">All</button>
            <button id="mode-fav" class="mode-btn" role="tab">★ Favorites <span id="fav-count" class="count-badge">0</span></button>
            <button id="mode-critical" class="mode-btn" role="tab" title="Questions marked as critical (repeatedly missed)">🔥 Critical <span id="crit-count" class="count-badge">0</span></button>
            <button id="mode-unfav" class="mode-btn" role="tab" title="Review questions you haven't starred">☆ Not starred</button>
          </div>
          <label>Set:
            <select id="learn-set-select">
              <option value="all">All sets</option>
              <option value="1">Set 1</option>
              <option value="2">Set 2</option>
              <option value="3">Set 3</option>
              <option value="4">Set 4</option>
              <option value="5">Set 5</option>
              <option value="6">Set 6</option>
            </select>
          </label>
        </div>
        <div class="toolbar-row">
          <div class="mode-toggle" role="tablist" title="Switch between just-flip study and try-to-answer quiz">
            <button id="study-mode" class="mode-btn active" role="tab">📖 Study</button>
            <button id="quiz-mode" class="mode-btn" role="tab">✍️ Quiz</button>
          </div>
          <span id="card-counter" class="muted"></span>
          <span id="learn-progress" class="muted small"></span>
          <span id="quiz-score" class="muted small" hidden></span>
          <button id="card-shuffle">Shuffle</button>
          <button id="card-reset">Reset Order</button>
        </div>
      </div>
      <div id="flashcard" class="flashcard">
        <div class="card-inner">
          <div class="card-face card-front"></div>
          <div class="card-face card-back"></div>
        </div>
        <div class="fav-btns">
          <button id="card-critical" class="fav-btn crit-btn" title="Mark as critical (C)" aria-label="Critical">🔥</button>
          <button id="card-fav" class="fav-btn" title="Mark as favorite (F)" aria-label="Favorite">☆</button>
        </div>
      </div>
      <div class="card-nav">
        <button id="card-prev">← Prev</button>
        <button id="card-flip">Flip</button>
        <button id="card-next">Next →</button>
      </div>
      <p class="muted small">Tip: click the card to flip · ←/→ to navigate · F favorite · C critical</p>
      <div id="fav-list-wrap" class="fav-list-wrap" hidden>
        <div class="fav-list-head">
          <h2>Favorites <span class="muted small" id="fav-list-count"></span></h2>
          <div class="fav-list-actions">
            <button id="fav-shuffle" title="Shuffle favorites order">🔀 Shuffle</button>
            <button id="fav-reset-order" title="Restore original favorites order">↺ Reset order</button>
            <button id="fav-reset" class="danger" title="Remove all favorites">Reset All</button>
          </div>
        </div>
      </div>
    </section>
  </template>

  <template id="tpl-mocks">
    <section class="mocks">
      <header class="page-head">
        <h1>Mock Test</h1>
      </header>
      <div class="mock-generate-bar">
        <label>Exam set:
          <select id="mock-set-select">
            <option value="1">Set 1</option>
            <option value="2">Set 2</option>
            <option value="3">Set 3</option>
            <option value="4">Set 4</option>
            <option value="5">Set 5</option>
            <option value="6">Set 6</option>
            <option value="random">Random (all sets)</option>
          </select>
        </label>
        <label id="mock-random-count-wrap" hidden>Questions:
          <input id="mock-random-count" type="number" min="1" max="390" value="65">
        </label>
        <button id="generate-mock" class="primary">+ Generate New Mock Test</button>
      </div>
      <div class="mock-list-wrap">
        <h2>Previous Mock Tests</h2>
        <ul id="mock-list" class="mock-list"></ul>
      </div>
    </section>
  </template>

  <template id="tpl-mock-start">
    <section class="mock-start">
      <header class="page-head">
        <h1 id="mock-name"></h1>
        <button class="back" data-nav="mocks">← Back</button>
      </header>
      <div class="briefing">
        <div class="metric"><label>Questions</label><span id="mock-count"></span></div>
        <div class="metric"><label>Time limit</label><span id="mock-time"></span></div>
        <div class="metric"><label>Created</label><span id="mock-created"></span></div>
        <div class="metric"><label>Status</label><span id="mock-status"></span></div>
      </div>
      <p class="muted">Questions are hidden until you press Start. The timer begins immediately.</p>
      <div class="start-actions">
        <button id="mock-start-btn" class="primary big">▶ Start Exam</button>
        <button id="mock-delete" class="danger">Delete</button>
        <button id="mock-download" class="ghost">Download JSON</button>
      </div>
      <div id="mock-review-pane"></div>
    </section>
  </template>

  <template id="tpl-exam">
    <section class="exam">
      <header class="exam-head">
        <div>
          <h1 id="exam-name"></h1>
          <p class="muted small" id="exam-progress"></p>
        </div>
        <div class="timer-wrap">
          <span id="exam-timer" class="timer">02:00:00</span>
          <button id="exam-submit" class="primary">Submit</button>
        </div>
      </header>
      <div class="exam-body">
        <aside class="qnav" id="qnav"></aside>
        <div class="qpane" id="qpane"></div>
      </div>
    </section>
  </template>

  <template id="tpl-results">
    <section class="results">
      <header class="page-head">
        <h1 id="result-name"></h1>
        <button class="back" data-nav="mocks">← Back to mocks</button>
      </header>
      <div class="scoreboard">
        <div class="score-card">
          <label>Score</label>
          <div class="score" id="result-score"></div>
        </div>
        <div class="score-card">
          <label>Correct</label>
          <div class="ok" id="result-correct"></div>
        </div>
        <div class="score-card">
          <label>Wrong</label>
          <div class="bad" id="result-wrong"></div>
        </div>
        <div class="score-card">
          <label>Unanswered</label>
          <div class="muted" id="result-unanswered"></div>
        </div>
        <div class="score-card">
          <label>Time taken</label>
          <div id="result-time"></div>
        </div>
      </div>
      <div class="filter-row">
        <label><input type="radio" name="filter" value="all" checked /> All</label>
        <label><input type="radio" name="filter" value="wrong" /> Wrong only</label>
        <label><input type="radio" name="filter" value="right" /> Correct only</label>
      </div>
      <div id="result-list" class="result-list"></div>
    </section>
  </template>

  <template id="tpl-mini">
    <section class="mini">
      <header class="page-head">
        <h1>Mini Practice</h1>
        <button class="back" data-nav="home">← Home</button>
      </header>
      <div class="mode-toggle" role="tablist" title="Choose which questions to drill">
        <button id="mini-src-failed" class="mode-btn active" role="tab">🎯 Most-missed</button>
        <button id="mini-src-fav" class="mode-btn" role="tab">★ Favorites</button>
        <button id="mini-src-critical" class="mode-btn" role="tab" title="Drill only the questions marked as critical">🔥 Critical</button>
        <button id="mini-src-unfav" class="mode-btn" role="tab">☆ Not starred</button>
      </div>
      <p id="mini-info" class="muted"></p>
      <p id="mini-progress" class="muted small"></p>
      <div id="mini-pane"></div>
    </section>
  </template>

  <template id="tpl-courses">
    <section class="courses">
      <header class="page-head">
        <h1>Courses</h1>
        <button class="back" data-nav="home">← Home</button>
      </header>
      <div id="course-bookmarks-wrap" class="bookmarks-wrap" hidden>
        <h2>★ Bookmarks</h2>
        <ul id="course-bookmarks-list" class="bookmarks-list"></ul>
      </div>
      <div id="courses-list" class="course-list"></div>
    </section>
  </template>

  <template id="tpl-course-modules">
    <section class="course-modules">
      <header class="page-head">
        <h1 id="course-title"></h1>
        <button class="back" data-nav="courses">← Courses</button>
      </header>
      <p class="muted small" id="course-source"></p>
      <div id="module-list" class="module-list"></div>
    </section>
  </template>

  <template id="tpl-course-lesson">
    <section class="course-lesson">
      <header class="page-head">
        <h1 id="lesson-module-title"></h1>
        <div class="controls">
          <button id="lesson-bookmark" class="ghost" title="Bookmark this lesson">☆ Bookmark</button>
          <div class="font-size-control" role="group" aria-label="Text size">
            <button id="font-size-dec" title="Smaller text">A-</button>
            <button id="font-size-reset" title="Reset text size">A</button>
            <button id="font-size-inc" title="Larger text">A+</button>
          </div>
          <button class="back" id="lesson-back">← Modules</button>
        </div>
      </header>
      <div class="lesson-body">
        <aside class="lesson-nav" id="lesson-nav"></aside>
        <article class="lesson-content" id="lesson-content"></article>
      </div>
    </section>
  </template>

  <script src="app.js?v=4"></script>
</body>
</html>
